<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS + Python Workbench</title>
  </head>
  <body>
    <main
      style="
        font-family: system-ui, sans-serif;
        max-width: 640px;
        margin: 2rem auto;
        padding: 0 1rem;
      "
    >
      <h1>JS + Python Workbench</h1>
      <p>
        Send comma-separated items to the local FastAPI service
        (<code>/api/batch-summary</code>):
      </p>

      <label for="items-input" style="display: block; margin-bottom: 0.5rem"
        >Items</label
      >
      <input
        id="items-input"
        type="text"
        value="alpha, beta, gamma, delta, epsilon"
        style="width: 100%; padding: 0.5rem; margin-bottom: 1rem"
      />

      <label for="batch-size" style="display: block; margin-bottom: 0.5rem"
        >Batch Size</label
      >
      <input
        id="batch-size"
        type="number"
        min="1"
        max="100"
        value="2"
        style="width: 6rem; padding: 0.5rem; margin-right: 0.75rem"
      />

      <button
        id="run-btn"
        type="button"
        style="padding: 0.5rem 1rem; cursor: pointer"
      >
        Run Batch Summary
      </button>

      <pre
        id="output"
        style="
          margin-top: 1.5rem;
          padding: 1rem;
          background: #1e1e1e;
          color: #e6e6e6;
          border-radius: 6px;
          overflow-x: auto;
        "
      >
Click "Run Batch Summary" to test the FastAPI connection...</pre
      >
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
