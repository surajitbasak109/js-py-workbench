name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/py_service/requirements.txt

      - name: Create Python virtual environment and install dependencies
        run: |
          python -m venv apps/py_service/.venv
          pnpm run install:py

      - name: Run linters
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Verify production frontend build
        run: pnpm run build
